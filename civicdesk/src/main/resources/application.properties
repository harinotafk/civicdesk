spring.application.name=civicdesk

# ---------- Database ----------
# A separate database from the tutorial one, created automatically on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/civicdesk_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Run data.sql (zones, wards, departments, categories) after Hibernate creates the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---------- Errors (Boot 4 property names) ----------
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# ---------- JWT ----------
# Must be at least 32 characters. Override in production with the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:civicdesk-dev-secret-change-me-in-production-2026}
app.jwt.expiry-hours=8

# ---------- SLA engine ----------
# How often the escalation job looks for overdue complaints (milliseconds)
app.sla.check-interval-ms=60000
# Extra hours given at each escalation level before the next escalation
app.sla.escalation-extension-hours=24

# ---------- Demo data ----------
# Seeds demo officers, citizens and complaints on first start (only if the users table is empty)
app.demo.seed=true
